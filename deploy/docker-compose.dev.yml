version: "3"
services:
  app:
    image: analytics-server:latest
    container_name: analytics_app
    restart: always
    ports:
      - "5251:8080"
    env_file: .env
    depends_on:
      - postgres
      - clickhouse

  postgres:
    image: postgres:15
    container_name: analytics_postgres
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: .env

  clickhouse:
    image: clickhouse/clickhouse-server:23.8.4.69
    container_name: analytics_clickhouse
    restart: always
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    env_file: .env
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres-data:
  clickhouse-data:
