name: Backup round-trip test
on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  roundtrip:
    name: Backup + restore round trip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: megamiley/ssh-checkout@main
        with:
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.GIT_SSH_KEY }}

      - name: Back up seeded databases and restore them
        run: deploy/backup/test-roundtrip.sh
